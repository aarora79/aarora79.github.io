<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found &middot; Amit Arora</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #0b1220;
    --muted: #57606a;
    --accent: #1f6feb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
                 Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  h1 {
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    letter-spacing: -0.02em;
  }

  p { color: var(--muted); margin-top: 10px; }

  a { color: var(--accent); text-decoration: none; margin-top: 24px; display: inline-block; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>That page does not exist.</p>
    <a href="/">Back to the homepage</a>
  </div>
</body>
</html>
